spring.application.name=spring

spring.datasource.url=jdbc:mysql://springdb.cxmg628ccjbz.us-east-1.rds.amazonaws.com:3306/springdb
spring.datasource.username=springuser
spring.datasource.password=springuser

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:172.31.38.242}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:usuario1}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:676767}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# =====================================
# CONSUMIDORES - REINTENTOS
# =====================================

spring.rabbitmq.listener.simple.acknowledge-mode=auto

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# Al agotar los reintentos, rechazar el mensaje
# sin devolverlo a la cola original.
# RabbitMQ lo enviara a la DLQ configurada.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =====================================
# PUBLICADOR
# =====================================

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true



rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://172.31.38.242:15673}
rabbitmq.management.username=${RABBITMQ_MANAGEMENT_USERNAME:usuario1}
rabbitmq.management.password=${RABBITMQ_MANAGEMENT_PASSWORD:676767}
rabbitmq.demo.enabled=${RABBITMQ_DEMO_ENABLED:true}

# =====================================
# KAFKA
# =====================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:172.31.38.242:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:cloud-backend}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}

app.kafka.events-topic=${KAFKA_EVENTS_TOPIC:cloud.events.v1}
app.kafka.notifications-topic=${KAFKA_NOTIFICATIONS_TOPIC:cloud.notifications.v1}
app.kafka.partitions=${KAFKA_PARTITIONS:3}
app.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
